[project]
name = "koletivo-trader"
version = "1.0.0"
description = "Koletivo Trader — robô WIN com swing, daytrade e integrador MT5"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "pyyaml>=6.0.0",
  "joblib>=1.4.0",
  "pydantic>=2.0.0",
  "optuna>=4.0.0",
]

[project.optional-dependencies]
windows = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
